onAuthStateChanged(auth, async user => {
  currentUser = user;
  if (user) {
    const _ava = document.getElementById('avatarBtn');
    if(user.photoURL){
      _ava.innerHTML = '<img src="'+user.photoURL+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="">';
    } else { _ava.textContent = '😊'; }
    document.getElementById('ssAva').textContent  = '😊';
    document.getElementById('ssName').textContent = user.displayName || user.email;
    document.getElementById('ssBadge').textContent= '✅ Giriş Yapıldı';
    document.getElementById('panelLogin').style.display  = 'none';
    document.getElementById('panelLogout').style.display = 'flex';
    document.getElementById('panelLogout2').style.display= 'block';
    // Admin/editör rol kontrolü
    const userDataSnap = await getDoc(doc(db,'users', user.uid));
    if (userDataSnap.exists()) {
      currentRole = userDataSnap.data().role || 'user';
      if (currentRole === 'admin' || currentRole === 'editor') {
        document.getElementById('adminPanelLink').style.display = 'flex';
        document.getElementById('adminHeaderLink').style.display = 'flex';
      }
    }
    // Esnaf başvuru kontrolü
    checkEsnafDurumu(user.uid);
    loadUserStats(user.uid);
  } else {
    if(_profileUnsub) { _profileUnsub(); _profileUnsub = null; }
    currentUser = null; currentRole = null;
    document.getElementById('avatarBtn').textContent = '👤';
    document.getElementById('ssAva').textContent     = '👤';
    document.getElementById('ssName').textContent    = 'Giriş Yapın';
    document.getElementById('ssBadge').textContent   = '🏘️ Mutlular Mahallesi';

    document.getElementById('adminHeaderLink').style.display = 'none';
    document.getElementById('esnafPanelLink').style.display = 'none';
    ['ssP','ssG','ssR'].forEach(id => document.getElementById(id).textContent = '—');
  }
});

window.doLogin = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  if (!email||!pass){showToast('E-posta ve şifre girin.',true);return;}
  setLoad('loginBtn',true);
  try { await signInWithEmailAndPassword(auth,email,pass); closeLogin(); showToast('Hoş geldiniz! 👋'); }
  catch(e){ showToast(authErr(e.code),true); }
  finally { setLoad('loginBtn',false); }
};

window.selectHesapTuru = (tur) => {
  _hesapTuru = tur;

  document.getElementById('ht-esnaf').classList.toggle('active', tur === 'esnaf');
  document.getElementById('esnafEkAlanlar').style.display = tur === 'esnaf' ? 'block' : 'none';

window.doRegister = async () => {
  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass  = document.getElementById('regPass').value;
  if (!name || !email || !pass) { showToast('Tüm alanları doldurun.', true); return; }
  if (pass.length < 6) { showToast('Şifre en az 6 karakter olmalı.', true); return; }

  if (_hesapTuru === 'esnaf') {
    const isyeri = document.getElementById('regIsyeri').value.trim();
    if (!isyeri) { showToast('İşyeri adı zorunludur.', true); return; }
  }

  setLoad('regBtn', true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });

    if (_hesapTuru === 'esnaf') {
      const isyeri   = document.getElementById('regIsyeri').value.trim();
      const kategori = document.getElementById('regKategori').value;
      const telefon  = document.getElementById('regTelefon').value.trim();
      const adres    = document.getElementById('regAdres').value.trim();
      // users koleksiyonuna UID key ile kaydet
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, role: 'esnaf', puan: 0, createdAt: serverTimestamp()
      });
      // esnaf_basvurular koleksiyonuna düş - admin onaylayacak
      await addDoc(collection(db, 'esnaf_basvurular'), {
        uid: cred.user.uid, name, email, isyeri, kategori,
        telefon: telefon || '', adres: adres || '',
        status: 'pending',
        createdAt: serverTimestamp()
      });
      closeLogin();
      showToast('Esnaf başvurunuz alındı! Admin onayından sonra aktif olur. 🏪');
    } else {
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, role: 'user', puan: 0, createdAt: serverTimestamp()
      });
      closeLogin();
      showToast('Kayıt başarılı! 🎉');
    }
  } catch(e) {
    showToast(authErr(e.code), true);
  } finally {
    setLoad('regBtn', false);
  }
};

window.goPage = (page, data={}) => {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('scr-'+page)?.classList.add('active');
  // nav highlight
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active', n.dataset.page===page);
    const lbl=n.querySelector('.nav-lbl');
    if(lbl) lbl.style.color = n.dataset.page===page?'#D32F2F':'';
  });
  window.scrollTo(0,0);
  if (page==='home')         { /* already loaded */ }
  if (page==='search')       loadSearch('');
  if (page==='notifications') loadNotifications();
  if (page==='profile')      loadProfile();
  if (page==='haber')        renderHaberDetay(data);
  if (page==='kursus')       loadKursus();
  if (page==='harita')       { setTimeout(()=>{if(window.initHaritaDetay)window.initHaritaDetay();},100); }
};

function loadPano() {
  const q = query(collection(db,'ilanlar'), where('status','==','approved'), orderBy('createdAt','desc'), limit(8));
  onSnapshot(q, snap => {
    const row = document.getElementById('panoRow');
    row.innerHTML = '';
    if (snap.empty) { row.innerHTML = '<div class="empty-card">📭 Henüz onaylanmış ilan yok</div>'; return; }
    snap.forEach(d => row.appendChild(buildPanoCard(d.id, d.data())));
  }, err => {
    // Composite index henüz oluşturulmamışsa index linki console'a düşer,
    // fallback olarak daha basit sorgu dene
    console.warn('loadPano index hatası:', err.message);
    const q2 = query(collection(db,'ilanlar'), orderBy('createdAt','desc'), limit(20));
    onSnapshot(q2, snap => {
      const row = document.getElementById('panoRow');
      row.innerHTML = '';
      const approved = snap.docs.filter(d => d.data().status === 'approved');
      if (!approved.length) { row.innerHTML = '<div class="empty-card">📭 Henüz onaylanmış ilan yok</div>'; return; }
      approved.slice(0,8).forEach(d => row.appendChild(buildPanoCard(d.id, d.data())));
    });
  });
}

function buildPanoCard(id, data) {
  const tagColors = {kayip:'#7B1FA2',acil:'#C62828',satilik:'#2E7D32',duyuru:'#1565C0',sorun:'#BF360C',vefat:'#37474F',foto:'#0277BD',etkinlik:'#558B2F'};
  const tagLabels = {kayip:'KAYIP',acil:'ACİL',satilik:'SATILIK',duyuru:'DUYURU',sorun:'SORUN',vefat:'VEFAT',foto:'FOTO',etkinlik:'ETKİNLİK'};
  const emojis    = {kayip:'🔍',acil:'🩸',satilik:'📦',duyuru:'📢',sorun:'🚧',vefat:'🕊️',foto:'📸',etkinlik:'📅'};
  const ago       = timeAgo(data.createdAt?.toDate());
  const div       = document.createElement('div');
  div.className   = 'pano-card';
  div.onclick     = () => openIlanDetay(id, data);

  if (data.imageURL) {
    div.innerHTML = `
      <div class="pc-bg" style="background:url('${data.imageURL}') center/cover;"></div>
      <div class="pc-ov"></div>
      <div class="pc-tag-abs" style="background:${tagColors[data.kategori]||'#333'};">${tagLabels[data.kategori]||'İLAN'}</div>
      <div class="pc-body-abs">
        <div class="pc-title-w">${esc(data.baslik)}</div>
        <div class="pc-time-w">${ago}</div>
      </div>`;
  } else {
    div.classList.add('light-card');
    div.innerHTML = `
      <div class="pc-tag-top" style="background:${tagColors[data.kategori]||'#333'};">${tagLabels[data.kategori]||'İLAN'}</div>
      <div class="lc-img">${emojis[data.kategori]||'📌'}</div>
      <div class="pc-title-d">${esc(data.baslik)}</div>
      <div class="pc-desc-d">${esc((data.aciklama||'').substring(0,50))}…</div>
      <div class="pc-time-d">${ago}</div>`;
  }
  return div;
}

function loadHaberler() {
  const q = query(collection(db,'haberler'), orderBy('createdAt','desc'), limit(20));
  onSnapshot(q, snap => {
    if (snap.empty) return;
    const all = snap.docs.map(d => ({id:d.id, ...d.data()}));
    // Önce son dakika, yoksa tüm haberler
    const sonDakika = all.filter(d => d.sonDakika === true);
    heroSlides = (sonDakika.length ? sonDakika : all).slice(0, 5);
    if (heroSlides.length) { renderHero(heroSlides[0]); updateDots(heroSlides.length); }
    // Arşiv için geri kalan haberler
    loadArsiv(all);
  }, err => {
    console.warn('loadHaberler:', err.message);
  });
}

function renderHero(data) {
  // Dinamik etiket
  const pill  = document.getElementById('heroPill');
  const label = document.getElementById('heroLabel');
  if(pill && label){
    if(data.sonDakika){ pill.className='sd-pill son-dakika'; label.textContent='SON DAKİKA'; }
    else              { pill.className='sd-pill haber';      label.textContent='HABER'; }
  }
  document.getElementById('heroTitle').textContent   = data.baslik||'';
  document.getElementById('heroExcerpt').textContent = data.ozet||'';
  document.getElementById('heroTime').textContent    = timeAgo(data.createdAt?.toDate());
  document.getElementById('heroNum').textContent     = `${heroIdx+1}/${heroSlides.length}`;
  document.getElementById('heroCard').onclick        = () => goPage('haber',data);
  if(data.imageURL){
    document.getElementById('heroBg').style.backgroundImage = `url('${data.imageURL}')`;
    document.getElementById('heroTruck').style.display = 'none';
  } else {
    document.getElementById('heroBg').style.backgroundImage = '';
    document.getElementById('heroTruck').style.display = 'block';
  }
}

function updateDots(count) {
  const c = document.getElementById('sliderDots');
  c.innerHTML = '';
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    if(i===0) s.classList.add('active');
    s.onclick=()=>{heroIdx=i;renderHero(heroSlides[i]);refreshDots();};
    c.appendChild(s);
  }
}
function refreshDots(){
  document.querySelectorAll('#sliderDots span').forEach((s,i)=>s.classList.toggle('active',i===heroIdx));
}
setInterval(()=>{
  if(!heroSlides.length)return;
  heroIdx=(heroIdx+1)%heroSlides.length;
  renderHero(heroSlides[heroIdx]); refreshDots();
},4000);

async function loadHaberRating(hid) {
  if(!hid) return;
  try {
    const snap = await getDocs(collection(db,'haberler',hid,'oylar'));
    const total = snap.size;
    if(!total) return;
    const sum = snap.docs.reduce((a,d) => a + (d.data().puan||0), 0);
    const avg = (sum/total).toFixed(1);
    const el  = document.getElementById('haberRatingScore');
    if(el) el.textContent = avg + ' / 5 (' + total + ' oy)';
    const stars = document.querySelectorAll('#haberStars .drb-star');
    stars.forEach((s,i) => s.classList.toggle('active', i < Math.round(parseFloat(avg))));
    // Check if current user already rated
    if(currentUser) {
      const mySnap = await getDoc(doc(db,'haberler',hid,'oylar',currentUser.uid));
      if(mySnap.exists()){
        const myPuan = mySnap.data().puan;
        stars.forEach((s,i) => s.classList.toggle('active', i < myPuan));
        if(el) el.textContent = 'Puanınız: ' + myPuan + ' ★  |  Ortalama: ' + avg + ' (' + total + ' oy)';
      }
    }
  } catch(e){ console.warn('Rating:', e.message); }
}

window.rateHaber = async (hid, puan) => {
  if(!currentUser){ window.openLogin('giris'); return; }
  if(!hid){ showToast('Haber bulunamadı.', true); return; }
  try {
    await setDoc(doc(db,'haberler',hid,'oylar',currentUser.uid), { puan, uid: currentUser.uid }, {merge:true});
    showToast('Puanınız kaydedildi ✅');
    loadHaberRating(hid);
  } catch(e){ showToast('Hata: '+e.message, true); }
};

      query(collection(db,'haberler',hid,'yorumlar'), orderBy('createdAt','asc'), limit(50))
    );
    const count = snap.size;
    if(countEl)  countEl.textContent = count;
    if(titleEl)  titleEl.textContent = 'Yorumlar (' + count + ')';
    if(snap.empty){
      listEl.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:10px 0;">Henüz yorum yok. İlk yorumu sen yap!</div>';
      return;
    }
    listEl.innerHTML = snap.docs.map(d => {
      const yd = d.data();
      const letter = esc(yd.authorName||'?').charAt(0).toUpperCase();
      return '<div class="det-comment">'
        + '<div class="dc-ava">'+letter+'</div>'
        + '<div class="dc-body">'

    listEl.innerHTML = '<div style="color:var(--muted);font-size:13px;">Yorumlar yüklenemedi.</div>';

  }
}

function buildEsnafCard(id, data) {

  clearTimeout(searchTimer);

async function loadSearch(term) {
  const list = document.getElementById('searchResults');
  if (!term.trim()) {
    list.innerHTML = `<div style="padding:40px;text-align:center;color:#8E8E93;font-size:14px;">🔍 Aramak istediğinizi yazın</div>`;
    return;
  }
  list.innerHTML = '<div class="loading-sm">Aranıyor…</div>';
  const term_lower = term.toLowerCase();

  try {
    const [haberSnap, ilanSnap] = await Promise.all([
      getDocs(query(collection(db,'haberler'), orderBy('createdAt','desc'), limit(50))),
      getDocs(query(collection(db,'ilanlar'), orderBy('createdAt','desc'), limit(100)))
    ]);

    list.innerHTML = '';
    let count = 0;

    haberSnap.forEach(d => {
      const data=d.data();
      if((data.baslik||'').toLowerCase().includes(term_lower) || (data.ozet||'').toLowerCase().includes(term_lower)){
        count++;
        const item=document.createElement('div');
        item.className='search-item';
        item.onclick=()=>goPage('haber',{id:d.id,...data});
        item.innerHTML=`
          <div class="si-icon">${data.emoji||'📰'}</div>
          <div class="si-body">
            <div class="si-type">HABER</div>
            <div class="si-title">${highlight(esc(data.baslik),term)}</div>
            <div class="si-meta">${timeAgo(data.createdAt?.toDate())}</div>
          </div>`;
        list.appendChild(item);
      }
    });

    ilanSnap.forEach(d => {
      const data=d.data();
      if(data.status !== 'approved') return;
      if((data.baslik||'').toLowerCase().includes(term_lower) || (data.aciklama||'').toLowerCase().includes(term_lower)){
        count++;
        const item=document.createElement('div');
        item.className='search-item';
        item.onclick=()=>openIlanDetay(d.id,data);
        item.innerHTML=`
          <div class="si-icon">${{kayip:'🔍',acil:'🩸',satilik:'📦',duyuru:'📢',sorun:'🚧'}[data.kategori]||'📌'}</div>
          <div class="si-body">
            <div class="si-type">${(data.kategori||'İLAN').toUpperCase()}</div>
            <div class="si-title">${highlight(esc(data.baslik),term)}</div>
            <div class="si-meta">${timeAgo(data.createdAt?.toDate())}</div>
          </div>`;
        list.appendChild(item);
      }
    });

    if(count===0) list.innerHTML=`<div style="padding:40px;text-align:center;color:#8E8E93;font-size:14px;">😕 "${esc(term)}" için sonuç bulunamadı</div>`;
  } catch(e) {
    console.warn('Arama hatası:', e.message);
    list.innerHTML = `<div style="padding:40px;text-align:center;color:#8E8E93;font-size:14px;">⚠️ Arama şu anda yapılamıyor</div>`;
  }
}

function highlight(text, term) {
  const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return text.replace(re,'<mark style="background:#FFEB3B;border-radius:2px;">$1</mark>');
}

      uid:        currentUser.uid,
      authorName: currentUser.displayName || currentUser.email || 'Kullanıcı',
      kaynak:     'kursus',
      createdAt:  serverTimestamp()

    closeKursusModal();
    showToast('Bildiriminiz alındı! Onay sonrası mahalle panosuna eklenecek ✅');

window.kampanyaGonder = async () => {

  const mesaj = document.getElementById('epKampanyaMesaj').value.trim();
  if (!mesaj) { showToast('Kampanya mesajı boş olamaz.', true); return; }
  if (mesaj.length > 200) { showToast('Mesaj en fazla 200 karakter olabilir.', true); return; }

  const btn = document.getElementById('epKampanyaBtn');
  btn.disabled = true; btn.textContent = '⏳ Gönderiliyor…'; btn.style.opacity = '0.7';

  try {
    let imageURL = null;
    const fotoInput = document.getElementById('epKampanyaFoto');
    if(fotoInput && fotoInput.files && fotoInput.files[0]){
      const file = fotoInput.files[0];
      if(file.size > 10*1024*1024){ showToast('Fotoğraf 10 MB\'dan büyük olamaz.', true); return; }
      btn.textContent = '📤 Yükleniyor…';
      imageURL = await uploadToCloudinary(file, 'mutlular_haber/kampanyalar');
    }

    const kampanyaPayload = {
      esnafId:   _currentEsnafData.id  || '',
      esnafAdi:  _currentEsnafData.isyeri || '',
      uid:       currentUser.uid,
      mesaj:     mesaj,
      status:    'pending',
      createdAt: serverTimestamp()
    };
    if(imageURL) kampanyaPayload.imageURL = imageURL;

    await addDoc(collection(db,'esnaf_kampanyalar'), kampanyaPayload);
    showToast('Kampanya gönderildi! Admin onayı bekleniyor. 📢');
    renderEsnafPanel();
  } catch(e) {
    showToast('Hata: ' + e.message, true);
  } finally {
    if(document.getElementById('epKampanyaBtn')){
      document.getElementById('epKampanyaBtn').disabled=false;
      document.getElementById('epKampanyaBtn').textContent='📢 Kampanyayı Gönder';
      document.getElementById('epKampanyaBtn').style.opacity='1';
    }
  }
};

// CLOUDINARY UPLOAD HELPER
// ══════════════════════════════════════════
async function uploadToCloudinary(file, folder) {
  const isVideo = file.type.startsWith('video/');
  const endpoint = `https://api.cloudinary.com/v1_1/${CLD_CLOUD}/${isVideo ? 'video' : 'image'}/upload`;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLD_PRESET);
  fd.append('folder', folder);

  let res;
  try {
    res = await fetch(endpoint, { method: 'POST', body: fd });
  } catch(netErr) {
    throw new Error('Ağ hatası: ' + netErr.message);
  }

  let data;
  try {
    data = await res.json();
  } catch {
    throw new Error('Cloudinary yanıt okunamadı (HTTP ' + res.status + ')');
  }

  if (data.secure_url) return data.secure_url;

  // Hata detayını göster
  const errMsg = data.error?.message || JSON.stringify(data).substring(0, 200);
  console.error('Cloudinary hata:', data);

  // Yaygın hataları Türkçeleştir
  if (errMsg.includes('Upload preset') || errMsg.includes('preset')) {
    throw new Error('Cloudinary preset hatası: "' + CLD_PRESET + '" unsigned preset bulunamadı. Cloudinary → Settings → Upload → Upload presets bölümünden kontrol edin.');
  }
  if (errMsg.includes('Invalid') && errMsg.includes('cloud')) {
    throw new Error('Cloudinary cloud name hatalı: "' + CLD_CLOUD + '"');
  }
  throw new Error('Cloudinary: ' + errMsg);
}

function timeAgo(date){

  if(d<86400)return Math.floor(d/3600)+' sa önce';
  return Math.floor(d/86400)+' gün önce';
}

const _fo=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.style.opacity='1';e.target.style.transform='translateY(0)';_fo.unobserve(e.target);}});},{threshold:0.08});
function observeCards(){
  document.querySelectorAll('.feed-card,.arsiv-item,.esnaf-card,.esnaf-card-new,.kampanya-kart,.pano-card').forEach(el=>{
    if(!el.dataset.obs){el.dataset.obs='1';el.style.opacity='0';el.style.transform='translateY(16px)';el.style.transition='opacity .38s ease,transform .38s ease';_fo.observe(el);}
  });
}
setTimeout(observeCards,800); setInterval(observeCards,2000);

// Harita
let _leafMap=null, _markers=[];
window.initHaritaDetay=()=>{
  const container=document.getElementById('haritaMap');
  if(!container)return;
  if(_leafMap){_leafMap.invalidateSize();return;}
  if(typeof L==='undefined'){
    let n=0;
    const t=setInterval(()=>{n++;if(typeof L!=='undefined'){clearInterval(t);_buildMap(container);}if(n>30)clearInterval(t);},300);
    return;
  }
  _buildMap(container);
};

function _buildMap(container){
  container.innerHTML='';
  _leafMap=L.map(container,{zoomControl:false,attributionControl:false,tap:true}).setView([40.1956,29.0601],15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(_leafMap);
  L.control.zoom({position:'bottomright'}).addTo(_leafMap);
  L.marker([40.1956,29.0601],{icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],html:'<div style="width:18px;height:18px;border-radius:50%;background:#2196F3;border:3px solid #fff;box-shadow:0 0 0 5px rgba(33,150,243,0.25);"></div>'})}).addTo(_leafMap).bindPopup('<b>📍 Mehmet Akif Mahallesi</b><br><small>Osmangazi / Bursa</small>');
  const PINS=[
    {lat:40.1970,lng:29.0618,e:'🚧',c:'#D32F2F',t:'sorun',l:'Yol çukuru — Mehmet Akif Cad.'},
    {lat:40.1942,lng:29.0585,e:'📅',c:'#1565C0',t:'etkinlik',l:'Mahalle pikniği — Cumartesi 14:00'},
    {lat:40.1975,lng:29.0575,e:'🏪',c:'#2E7D32',t:'esnaf',l:'Kasap Mehmet — %20 indirim'},
    {lat:40.1938,lng:29.0625,e:'🔍',c:'#F57F17',t:'kayip',l:'Kayıp kedi — Sarı, erkek'},
    {lat:40.1962,lng:29.0638,e:'📣',c:'#6A1B9A',t:'duyuru',l:'Su kesintisi 13:00–18:00'},
    {lat:40.1982,lng:29.0592,e:'🏪',c:'#00695C',t:'esnaf',l:'Fırın Ustası — Taze ekmek'},
    {lat:40.1933,lng:29.0568,e:'💧',c:'#0277BD',t:'sorun',l:'Kaldırım çökmüş'},
    {lat:40.1958,lng:29.0648,e:'🎉',c:'#C62828',t:'etkinlik',l:'Ramazan etkinliği'},
    {lat:40.1978,lng:29.0558,e:'🐕',c:'#FF8F00',t:'kayip',l:'Kayıp köpek — Bej rengi'},
    {lat:40.1948,lng:29.0608,e:'⚡',c:'#B71C1C',t:'duyuru',l:'Planlı elektrik kesintisi'},
  ];
  _leafMap._pins=PINS;
  _drawPins(PINS);
  document.querySelectorAll('.hf-chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.hf-chip').forEach(b=>b.classList.remove('hf-chip--active'));
      btn.classList.add('hf-chip--active');
      const kat=btn.dataset.kat||'tumu';
      _markers.forEach(m=>_leafMap.removeLayer(m));_markers=[];
      _drawPins(kat==='tumu'?_leafMap._pins:_leafMap._pins.filter(p=>p.t===kat));
    });
  });
}

function _drawPins(pins){
  pins.forEach((p,i)=>{
    const icon=L.divIcon({className:'',iconSize:[40,40],iconAnchor:[20,40],popupAnchor:[0,-44],
      html:`<div style="width:40px;height:40px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:${p.c};border:3px solid rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);font-size:18px;">${p.e}</span></div>`
    });
    const m=L.marker([p.lat,p.lng],{icon}).addTo(_leafMap).bindPopup(
      `<div style="font-family:'Inter',sans-serif;padding:2px;"><div style="font-size:9px;font-weight:900;color:${p.c};text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;">${p.t.toUpperCase()}</div><div style="font-size:13px;font-weight:700;color:#0D0D0D;">${p.l}</div></div>`,
      {maxWidth:220,className:'map-popup'}
    );
    _markers.push(m);
  });
}

window.toggleTheme = () => {
  const cur  = document.documentElement.getAttribute('data-theme') || 'light';

window.uploadAvatar = async (input) => {
  if(!input.files || !input.files[0] || !currentUser) return;
  const file = input.files[0];
  if(file.size > 5*1024*1024){ showToast('Fotoğraf 5 MB dan küçük olmalı', true); return; }
  showToast('Fotoğraf yükleniyor…');
  try {
    const url = await uploadToCloudinary(file, 'mutlular_haber/avatars');
    await updateProfile(currentUser, { photoURL: url });
    const img   = document.getElementById('phAvatarImg');
    const emoji = document.getElementById('phAvatarEmoji');
    if(img){ img.src = url; img.style.display = 'block'; }
    if(emoji) emoji.style.display = 'none';
    const topAva = document.getElementById('avatarBtn');
    if(topAva) topAva.innerHTML = '<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="">';
    showToast('Profil fotoğrafı güncellendi ✅');
  } catch(e){ showToast('Hata: '+e.message, true); }
};

window.openKampanyaDetay = async (id, data) => {
  const sheet = document.getElementById('kampDetaySheet');
  const ov    = document.getElementById('kampDetayOverlay');
  if(!sheet || !ov) return;

  sheet.innerHTML = '<div style="width:38px;height:4px;background:#E0E0E0;border-radius:2px;margin:12px auto 20px;"></div>'
    + '<div style="text-align:center;padding:20px;color:var(--muted);">Yükleniyor…</div>';

  document.body.style.overflow = 'hidden';

  // Esnaf telefon bilgisini çek
  let telefon = data.telefon || '';
  let adres   = data.adres   || '';
  try {
    if(data.esnafId){
      const esnafSnap = await getDoc(doc(db,'esnaf_basvurular', data.esnafId));
      if(esnafSnap.exists()){
        telefon = esnafSnap.data().telefon || telefon;

    : '';
  const telHtml = telefon
    ? '<a class="kd-call-btn" href="tel:'+telefon+'">📞 Hemen Ara — '+esc(telefon)+'</a>'
    : '';
  const adrHtml = adres
    ? '<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">📍 '+esc(adres)+'</div>'
    : '';

  sheet.innerHTML =
    '<div style="width:38px;height:4px;background:#E0E0E0;border-radius:2px;margin:12px auto 16px;"></div>'
    + '<button onclick="window.closeKampanyaDetay()" style="float:right;background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:8px;">✕</button>'

    + '<div class="kd-mesaj">'+esc(data.mesaj||'')+'</div>'
    + '<div class="kd-time">📅 '+timeAgo(data.createdAt?.toDate())+'</div>'

window.submitIlanYorum = async (ilanId) => {
  if(!currentUser){ window.openLogin('giris'); return; }
  const inp = document.getElementById('idetYorumInput');
  const yorum = inp ? inp.value.trim() : '';
  if(!yorum){ showToast('Yorum bos olamaz.', true); return; }
  try {
    await addDoc(collection(db,'ilanlar',ilanId,'yorumlar'),{
      yorum, uid: currentUser.uid,
      authorName: currentUser.displayName || currentUser.email,
      createdAt: serverTimestamp()
    });
    if(inp) inp.value = '';
    window.loadIlanComments(ilanId);
    showToast('Yorum eklendi!');
  } catch(e){ showToast('Hata: '+e.message, true); }
};

window.loadIlanComments = async (ilanId) => {
  const box = document.getElementById('idetComments');
  if(!box || !ilanId) return;
  box.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:6px 0;">Yukleniyor...</div>';
  try {
    const snap = await getDocs(query(collection(db,'ilanlar',ilanId,'yorumlar'), orderBy('createdAt','asc'), limit(20)));
    if(snap.empty){ box.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:6px 0;">Henuz yorum yok.</div>'; return; }
    box.innerHTML = snap.docs.map(d => {
      const yd = d.data();
      return '<div class="ilan-comment">'
        + '<div class="ic-ava">' + esc(yd.authorName||'?').charAt(0).toUpperCase() + '</div>'
        + '<div class="ic-body">'
          + '<div class="ic-name">' + esc(yd.authorName||'Anonim') + '</div>'
          + '<div class="ic-text">' + esc(yd.yorum||'') + '</div>'
          + '<div class="ic-time">' + timeAgo(yd.createdAt?.toDate()) + '</div>'
        + '</div></div>';
    }).join('');
  } catch(e){ box.innerHTML = ''; }
};

window.closeIlanDetay = () => {
  document.getElementById('ilanDetayModal').classList.remove('open');
  document.body.style.overflow = '';
};

window.deleteIlan = async (id) => {
  if(!currentUser){ showToast('Silmek için giriş yapın.', true); return; }
  if(!confirm('Bu ilanı kalıcı olarak silmek istiyor musunuz?')) return;
  try {
    await deleteDoc(doc(db,'ilanlar',id));
    window.closeIlanDetay();
    showToast('İlan silindi ✅');
  } catch(e){ showToast('Silme hatası: '+e.message, true); }
};

window.openIlanDetayFull = (id, data) => {
  window.openIlanDetay(id, data);
  setTimeout(() => window.loadIlanComments(id), 300);
};
window.openIlanDetay = (id, data) => {
  const katLabel = {
    kayip:'🔍 Kayıp İlanı', acil:'🩸 Acil Kan', satilik:'🛋️ Satılık',
    sorun:'📢 Mahalle Sorunu', duyuru:'📢 Duyuru',
    etkinlik:'📅 Etkinlik', foto:'📸 Fotoğraf', vefat:'🕊️ Vefat'
  };
  const isOwner = currentUser && currentUser.uid === data.uid;

  const titleEl = document.getElementById('idetTitle');
  if(titleEl){ titleEl.textContent = data.baslik||''; titleEl.dataset.id = id; }
  const katEl = document.getElementById('idetKat');
  if(katEl) katEl.textContent = katLabel[data.kategori] || (data.kategori||'').toUpperCase();
  const bodyEl = document.getElementById('idetBody');
  if(bodyEl) bodyEl.textContent = data.aciklama||'';
  const metaEl = document.getElementById('idetMeta');
  if(metaEl) metaEl.innerHTML = data.konum ? '📍 ' + esc(data.konum) : '';
  const timeEl = document.getElementById('idetTime');
  if(timeEl) timeEl.textContent = timeAgo(data.createdAt?.toDate());
  const authEl = document.getElementById('idetAuthor');
  if(authEl) authEl.textContent = data.authorName ? '👤 ' + data.authorName : '';

  const img = document.getElementById('idetImg');
  if(img){ img.src = data.imageURL||''; img.style.display = data.imageURL ? 'block' : 'none'; }

  // Silme butonu — sadece ilan sahibine
  const delBtn = document.getElementById('idetDeleteBtn');
  if(delBtn) delBtn.style.display = isOwner ? 'flex' : 'none';
  if(delBtn) delBtn.onclick = () => window.deleteIlan(id);

  // Telefon
  const phoneBtn = document.getElementById('idetPhone');
  if(phoneBtn){
    phoneBtn.href = data.telefon ? 'tel:'+data.telefon : '#';
    phoneBtn.style.display = data.telefon ? 'flex' : 'none';
  }

  // WhatsApp — telefon varsa VE ilan sahibi değilse
  const chatBtn = document.getElementById('idetChat');
  if(chatBtn){
    if(data.telefon && (!currentUser || data.uid !== currentUser.uid)){
      const msgs = {
        kayip: 'Kayip ilaninizi gordum, bilgi vermek istiyorum.',
        sorun: 'Sorun ilaninizi gordum.',
        satilik: 'Satilik ilaninizla ilgileniyorum.',
        acil: 'Acil ilaninizi gordum.',
        etkinlik: 'Etkinlik ilaninizi gordum.',
        duyuru: 'Duyurunuzu gordum.'
      };
      const msgTxt = msgs[data.kategori] || 'Ilaninizi gordum.';
      const msg  = encodeURIComponent('Merhaba, "' + (data.baslik||'') + '" — ' + msgTxt + ' (Mutlular Haber)');
      const tel  = data.telefon.replace(/\D/g,'');
      const num  = tel.startsWith('0') ? tel.slice(1) : tel;
      chatBtn.href = 'https://wa.me/90' + num + '?text=' + msg;
      chatBtn.style.display = 'flex';
    } else {
      chatBtn.style.display = 'none';
    }
  }

  // Yorum yükle
  window.loadIlanComments(id);

  document.getElementById('ilanDetayModal').classList.add('open');
  document.body.style.overflow = 'hidden';
};

.ah-sub{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:1px;}
.ah-right{display:flex;align-items:center;gap:6px;}
.notif-btn{position:relative;cursor:pointer;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:12px;transition:background .15s;}
.notif-btn:active{background:rgba(0,0,0,0.06);}
.notif-btn svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.notif-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:8px;font-weight:900;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}
.user-photo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--red),#FF6B6B);border:2px solid rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;box-shadow:0 2px 8px var(--red-glow);}
#adminHeaderLink{display:none;}

/* ═══ LOCATION + WEATHER BAR ═══ */
.location-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--white);border-bottom:1px solid var(--border);}
.lb-left{display:flex;align-items:center;gap:5px;}
.lb-loc-icon{font-size:12px;color:var(--red);}
.lb-loc-name{font-size:11px;font-weight:700;color:var(--ink2);}
.lb-weather{display:flex;align-items:center;gap:5px;}
.lb-temp{font-size:15px;font-weight:800;color:var(--ink);}
.lb-cond{font-size:12px;color:var(--muted);}

/* ═══ LIVE BAR ═══ */
.live-bar{display:flex;align-items:center;gap:8px;padding:9px 16px;background:linear-gradient(90deg,#1C0000,#2A0000);}
.live-dot{width:8px;height:8px;border-radius:50%;background:#FF4444;flex-shrink:0;animation:livePulse 1.6s ease-in-out infinite;}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.6);}50%{box-shadow:0 0 0 7px rgba(255,68,68,0);}}
.live-text{font-size:11px;font-weight:800;color:rgba(255,255,255,.88);letter-spacing:.8px;text-transform:uppercase;}
.live-time{margin-left:auto;font-size:11px;color:rgba(255,255,255,.4);}

/* ═══ QUICK ACTIONS ═══ */
.qa-section{background:var(--white);padding:12px 0 0;border-bottom:1px solid var(--border);}
.qa-scroll{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;}
.qa-scroll::-webkit-scrollbar{display:none;}
.qa-chip{flex-shrink:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 14px;border-radius:16px;background:var(--bg);border:1.5px solid var(--border);transition:transform .15s;min-width:70px;}
.qa-chip:active{transform:scale(0.93);}
.qa-chip-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.qa-chip-label{font-size:11px;font-weight:700;color:var(--ink);text-align:center;line-height:1.2;}

/* ═══ SECTION HEADER ═══ */
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;}
.sec-left{display:flex;align-items:center;gap:9px;}
.sec-icon{font-size:18px;}
.sec-title{font-size:16px;font-weight:800;color:var(--ink);}
.sec-sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;}
.see-all{font-size:12px;font-weight:700;color:var(--red);text-decoration:none;white-space:nowrap;}

/* ═══ HERO SLIDER ═══ */
.hero-section{padding:6px 14px 4px;}
.hero-card{border-radius:22px;overflow:hidden;position:relative;height:270px;cursor:pointer;box-shadow:var(--sh4);}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#1C0000,#3A0000);background-size:cover;background-position:center;transition:transform .7s ease;}
.hero-card:active .hero-bg{transform:scale(1.03);}
.hero-ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.6) 65%,rgba(0,0,0,.92) 100%);}
.hero-truck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;}
.hero-num{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;color:rgba(255,255,255,.75);background:rgba(0,0,0,.38);padding:4px 10px;border-radius:20px;backdrop-filter:blur(10px);}
.hero-body{position:absolute;bottom:0;left:0;right:0;padding:18px;}
.sd-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:900;letter-spacing:.8px;margin-bottom:8px;}
.sd-pill.son-dakika{background:var(--red);color:#fff;animation:pillPulse 2.4s ease-in-out infinite;}
.sd-pill.haber{background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(8px);}
@keyframes pillPulse{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.4);}50%{box-shadow:0 0 12px 4px rgba(211,47,47,0);}}
.sd-dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:sdBlink 1.4s infinite;flex-shrink:0;}
@keyframes sdBlink{0%,100%{opacity:1;}50%{opacity:.3;}}
.hero-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#fff;line-height:1.25;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.hero-excerpt{font-size:13px;color:rgba(255,255,255,.68);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hero-time{font-size:11px;color:rgba(255,255,255,.45);margin-top:6px;}
.slider-dots{display:flex;gap:5px;justify-content:center;padding:10px 0 4px;}
.slider-dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.15);cursor:pointer;transition:all .3s cubic-bezier(.34,1.5,.64,1);}
.slider-dot.active{width:20px;border-radius:3px;background:var(--red);}

/* ═══ FEED CARDS ═══ */
.feed-card-featured{margin:0 14px 12px;background:var(--white);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:var(--sh3);border:1px solid var(--border);transition:transform .18s;}
.feed-card-featured:active{transform:scale(.98);}
.fcf-img{width:100%;height:200px;background-size:cover;background-position:center;position:relative;}
.fcf-img--empty{display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#1C0000,#3A0000);}
.fcf-ov{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.5) 100%);}
.fcf-body{padding:14px 14px 16px;}
.fcf-badge{display:inline-block;font-size:9px;font-weight:900;padding:3px 9px;border-radius:20px;margin-bottom:8px;letter-spacing:.5px;}
.fcf-badge--red{background:#FFF0F0;color:var(--red);}
.fcf-badge--blue{background:#EFF4FF;color:#1565C0;}
.fcf-title{font-size:17px;font-weight:800;color:var(--ink);line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.fcf-excerpt{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fcf-meta{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-bottom:10px;}
.fcf-author{font-weight:700;color:var(--ink2);}
.fcf-stats{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);font-weight:600;}
.fcf-save,.fcf-share{background:none;border:none;cursor:pointer;font-size:14px;}
.fcf-share{margin-left:auto;}

.feed-card,.arsiv-item{margin:0 14px 10px;background:var(--white);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--sh1);border:1px solid var(--border);transition:transform .18s,box-shadow .18s;display:flex;align-items:stretch;}
.feed-card:active,.arsiv-item:active{transform:scale(.98);box-shadow:var(--sh2);}
.fc-left,.arsiv-body{flex:1;padding:13px 10px 12px 14px;}
.fc-badge{display:inline-block;font-size:8px;font-weight:900;padding:2px 8px;border-radius:20px;margin-bottom:7px;letter-spacing:.5px;}
.fc-badge--red{background:#FFF0F0;color:var(--red);}
.fc-badge--blue{background:#EFF4FF;color:#1565C0;}
.fc-title,.arsiv-title{font-size:14px;font-weight:800;color:var(--ink);line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.fc-excerpt,.arsiv-excerpt{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.fc-meta{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-bottom:8px;}
.fc-sep{color:var(--border);}
.fc-stats{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);font-weight:600;}
.fc-star{color:var(--gold);}
.fc-save,.fc-share{background:none;border:none;cursor:pointer;font-size:13px;}
.fc-share{margin-left:auto;}
.fc-thumb,.arsiv-thumb{width:108px;flex-shrink:0;overflow:hidden;border-left:1px solid var(--border);}
.fc-thumb img,.arsiv-thumb img{width:100%;height:100%;object-fit:cover;}
.fc-thumb-placeholder{width:108px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg);}
.arsiv-thumb{display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg);}
.arsiv-time{font-size:10px;color:var(--muted);margin-top:4px;}

/* ═══ PANO ═══ */
.pano-row{display:flex;gap:10px;padding:0 14px 2px;overflow-x:auto;scrollbar-width:none;}
.pano-row::-webkit-scrollbar{display:none;}
.pano-card{flex-shrink:0;width:150px;height:200px;border-radius:18px;overflow:hidden;position:relative;cursor:pointer;box-shadow:var(--sh2);transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.pano-card:active{transform:scale(.95);}
.pano-card.light-card{background:var(--white);border:1.5px solid var(--border);display:flex;flex-direction:column;padding:12px;justify-content:center;}
.pc-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.pc-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.15) 55%,transparent 100%);}
.pc-tag-abs{position:absolute;top:9px;left:9px;z-index:2;font-size:8px;font-weight:900;color:#fff;padding:3px 8px;border-radius:20px;letter-spacing:.5px;backdrop-filter:blur(8px);}
.pc-tag-top{display:inline-block;font-size:8px;font-weight:900;color:#fff;padding:3px 8px;border-radius:20px;letter-spacing:.5px;margin-bottom:8px;}
.pc-body-abs{position:absolute;bottom:0;left:0;right:0;padding:12px;z-index:2;}
.pc-title-w{font-size:12px;font-weight:800;color:#fff;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.pc-time-w{font-size:10px;color:rgba(255,255,255,.6);margin-top:4px;}
.lc-img{font-size:32px;text-align:center;margin-bottom:8px;}
.pc-title-d{font-size:12px;font-weight:800;color:var(--ink);line-height:1.3;margin-bottom:4px;}
.pc-desc-d{font-size:10px;color:var(--muted);line-height:1.4;flex:1;}
.pc-time-d{font-size:10px;color:var(--muted);margin-top:6px;}

/* ═══ ESNAF ═══ */
.esnaf-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 4px;}
.esnaf-card,.esnaf-card-new{background:var(--white);border-radius:18px;overflow:hidden;cursor:pointer;border:1px solid var(--border);box-shadow:var(--sh1);transition:transform .18s;}
.esnaf-card:active,.esnaf-card-new:active{transform:scale(.96);}
.ec-visual{width:100%;height:88px;background:linear-gradient(135deg,#F5F5F8,#EBEBF0);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ec-img-cover{width:100%;height:100%;object-fit:cover;}
.ec-emoji,.ec-img{font-size:36px;display:flex;align-items:center;justify-content:center;width:100%;height:80px;background:var(--bg);}
.ec-body{padding:10px 11px 12px;}
.ec-kat{font-size:9px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.ec-name{font-size:13px;font-weight:800;color:var(--ink);line-height:1.2;}
.ec-adres{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ec-rating{font-size:11px;color:var(--gold);font-weight:700;margin-top:5px;}

/* ═══ KAMPANYA ═══ */
.kamp-card,.kampanya-kart{margin:0 14px 10px;background:var(--white);border-radius:16px;overflow:hidden;border:1.5px solid #FFE0B2;box-shadow:var(--sh1);}
.kamp-img{width:100%;max-height:160px;object-fit:cover;}
.kamp-body{padding:14px;}
.kamp-tag{font-size:9px;font-weight:900;color:#E65100;letter-spacing:.5px;margin-bottom:4px;text-transform:uppercase;}
.kamp-esnaf,.kk-esnaf{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px;}
.kamp-mesaj,.kk-mesaj{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:6px;}
.kamp-time,.kk-time{font-size:11px;color:var(--muted);}
.kk-ico{width:44px;height:44px;border-radius:12px;background:#FFF3E0;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.kk-body{flex:1;min-width:0;}
.kamp-stats{display:flex;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:600;}

/* ═══ MAHALLE NABZI ═══ */
.nabiz-widget{margin:0 14px 14px;background:var(--white);border-radius:20px;border:1px solid var(--border);box-shadow:var(--sh2);overflow:hidden;}
.nw-header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);}
.nw-title{font-size:14px;font-weight:800;color:var(--ink);}
.nw-time{font-size:11px;color:var(--muted);}
.nw-status-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);}
.nws-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#E8F5E9,#C8E6C9);display:flex;align-items:center;justify-content:center;font-size:20px;}
.nws-label{font-size:15px;font-weight:800;color:#1B5E20;}
.nws-sub{font-size:11px;color:var(--muted);}
.nws-wave{flex:1;height:32px;overflow:hidden;}
.nws-wave svg{width:100%;height:100%;}
.nw-stats-row{display:flex;}
.nwsr-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-right:1px solid var(--border);}
.nwsr-item:last-child{border-right:none;}
.nwsr-dot{width:7px;height:7px;border-radius:50%;margin-bottom:5px;}
.nwsr-dot--green{background:#4CAF50;}
.nwsr-dot--yellow{background:#FFC107;}
.nwsr-dot--blue{background:#2196F3;}
.nwsr-dot--red{background:#D32F2F;}
.nwsr-val{font-size:12px;font-weight:800;color:var(--ink);}
.nwsr-lbl{font-size:10px;color:var(--muted);margin-top:1px;}

/* ═══ ANKET ═══ */
.anket-section{padding:0 14px 14px;}
.anket-card{background:linear-gradient(145deg,#3A0070,#1E0040);border-radius:22px;padding:18px;box-shadow:0 8px 28px rgba(74,0,128,.32);position:relative;overflow:hidden;}
.ak-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.ak-tag{font-size:9px;font-weight:900;color:rgba(255,255,255,.55);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.ak-icon-big{font-size:28px;}
.ak-question{font-size:17px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:16px;}
.ak-option{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ak-option-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.9);width:42px;flex-shrink:0;}
.ak-track{flex:1;height:9px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;}
.ak-fill{height:100%;border-radius:5px;transition:width 1.2s cubic-bezier(.34,1,.64,1);}
.ak-fill--green{background:linear-gradient(90deg,#4CAF50,#81C784);}
.ak-fill--red{background:linear-gradient(90deg,#EF5350,#FF8A80);}
.ak-pct{font-size:13px;font-weight:900;color:#fff;width:34px;text-align:right;}
.ak-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.ak-total{font-size:11px;color:rgba(255,255,255,.45);}
.ak-vote-btn{display:flex;align-items:center;gap:6px;background:#fff;color:#3A0070;border:none;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:900;cursor:pointer;font-family:'Inter',sans-serif;transition:transform .15s;}
.ak-vote-btn:active{transform:scale(.94);}

/* ═══ ACİL SHORTCUTS ═══ */
.acil-shortcuts{margin:0 14px 14px;background:var(--white);border-radius:18px;border:1.5px solid #FFCDD2;padding:14px;box-shadow:var(--sh1);}
.acil-sc-label{font-size:10px;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.acil-sc-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.acil-sc-btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg);border:1.5px solid var(--border);border-radius:13px;padding:10px 4px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .18s;}
.acil-sc-btn:active{background:#FFF0F0;border-color:var(--red);transform:scale(.95);}
.acil-sc-btn span:first-child{font-size:22px;}
.acil-sc-btn span:last-child{font-size:9px;font-weight:800;color:var(--ink2);}

/* ═══ HARITA ═══ */
.harita-header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0;}
.harita-back{width:36px
