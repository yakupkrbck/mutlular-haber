name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nöbetçi eczane listesini taze tutmak için siteyi her gün yeniden yayınlar (İstanbul saati UTC+3).
  schedule:
    - cron: '45 5 * * *'   # 08:45 İstanbul: nöbet listesi sabah 08:30'da değişir
    - cron: '30 15 * * *'  # 18:30 İstanbul: yedek yenileme

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Gerçek nöbetçi eczane verisi (API anahtarı yalnızca burada kullanılır, siteye gömülmez).
      # Başarısız olursa site yine yayınlanır; ana sayfada "liste alınamadı" görünür.
      - name: Nöbetçi eczane verisini indir
        continue-on-error: true
        env:
          ECZANE_API_BASE: ${{ secrets.ECZANE_API_BASE }}
          ECZANE_API_KEY: ${{ secrets.ECZANE_API_KEY }}
        run: node scripts/fetch-nobetci-eczane.mjs
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
